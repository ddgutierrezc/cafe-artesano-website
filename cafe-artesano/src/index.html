<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Café Artesano | Tueste natural en Palmichal de Acosta</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Café Artesano: café de tueste natural de Palmichal de Acosta.">
  <meta name="theme-color" content="#F7F8F3">
  <meta name="color-scheme" content="light dark">
  <script>
    (() => {
      const key = 'cafe-artesano-theme';
      let theme;
      try {
        const stored = localStorage.getItem(key);
        theme = stored === 'light' || stored === 'dark' ? stored : null;
      } catch {
        theme = null;
      }
      theme ??= window.matchMedia?.('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = theme;
      document.documentElement.style.colorScheme = theme;
      document.querySelector('meta[name="theme-color"]')?.setAttribute(
        'content', theme === 'dark' ? '#17110D' : '#F7F8F3',
      );
    })();
  </script>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="alternate icon" type="image/x-icon" href="favicon.ico">
</head>
<body>
  <app-root></app-root>
  <noscript>
    <main class="noscript-fallback" aria-labelledby="noscript-title">
      <section>
        <p class="noscript-fallback__eyebrow">Café de altura · Costa Rica</p>
        <h1 id="noscript-title">Café Artesano</h1>
        <p>Café de tueste natural de Palmichal de Acosta, Costa Rica.</p>
        <p><a href="tel:+50671606734">Llame al 7160-6734</a> para conocer nuestra disponibilidad.</p>
        <p class="noscript-fallback__note">El contenido interactivo y las animaciones requieren JavaScript; esta información esencial permanece disponible.</p>
      </section>
    </main>
  </noscript>
</body>
</html>
