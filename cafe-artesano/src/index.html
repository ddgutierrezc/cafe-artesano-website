<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Café Artesano | Tueste natural en Palmichal de Acosta</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Café Artesano: café de tueste natural de Palmichal de Acosta.">
  <meta name="theme-color" content="#F7F8F3">
  <meta name="color-scheme" content="light dark">
  <script>
    (() => {
      const key = 'cafe-artesano-theme';
      let theme;
      try {
        const stored = localStorage.getItem(key);
        theme = stored === 'light' || stored === 'dark' ? stored : null;
      } catch {
        theme = null;
      }
      theme ??= window.matchMedia?.('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = theme;
      document.documentElement.style.colorScheme = theme;
      document.querySelector('meta[name="theme-color"]')?.setAttribute(
        'content', theme === 'dark' ? '#17110D' : '#F7F8F3',
      );
    })();
  </script>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>
  <app-root></app-root>
</body>
</html>
